<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><meta name="description" content="DailyKit — everyday tools in one simple app.">
<title>DailyKit</title>
<style>
:root{--bg:#fbfaff;--panel:#fff;--ink:#29243a;--muted:#827c93;--line:#eee9f8;--lav:#8c6be8;--lav2:#f0eaff;--shadow:0 10px 30px #43316c0d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:900px;margin:auto;padding:22px 18px 40px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;gap:11px;align-items:center}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#a98cf4,#7958d7);color:white;display:grid;place-items:center;font-weight:800;font-size:20px;box-shadow:0 7px 18px #8c6be844}.brand h1{font-size:20px;margin:0;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:-2px}.iconbtn{border:1px solid var(--line);background:white;border-radius:12px;padding:9px 12px;color:var(--ink)}.hero{padding:25px;border-radius:24px;background:linear-gradient(120deg,#f0eaff,#faf7ff 65%,#fff);margin-bottom:23px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#8166c6;font-weight:750}.hero h2{font-size:27px;line-height:1.18;letter-spacing:-1px;margin:8px 0}.hero p{color:var(--muted);margin:0;max-width:500px}.sectionhead{display:flex;align-items:end;justify-content:space-between;margin:24px 2px 13px}.sectionhead h3{font-size:16px;margin:0}.sectionhead span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.tile{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 12px;text-align:left;min-height:122px;box-shadow:var(--shadow);color:var(--ink);transition:.15s}.tile:active{transform:scale(.98)}.tile .emoji{width:38px;height:38px;border-radius:13px;background:var(--lav2);display:grid;place-items:center;font-size:19px;margin-bottom:12px}.tile b{display:block;font-size:13px}.tile small{color:var(--muted);font-size:11px}.view{display:none}.view.active{display:block}.back{border:0;background:transparent;color:var(--lav);font-weight:700;padding:8px 0;margin:2px 0 14px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:19px;box-shadow:var(--shadow)}.card h2{margin:0 0 5px;font-size:21px}.sub{color:var(--muted);font-size:13px;margin:0 0 17px}.field{width:100%;border:1px solid var(--line);background:#fdfcff;border-radius:12px;padding:12px;color:var(--ink);outline:none}.field:focus{border-color:#b8a4f2;box-shadow:0 0 0 3px #eee8ff}.area{min-height:150px;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.btn{border:0;background:var(--lav);color:white;border-radius:12px;padding:11px 16px;font-weight:700}.btn.secondary{background:var(--lav2);color:#7052c4}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.stat{background:#f7f4ff;border-radius:12px;padding:10px 13px;min-width:85px}.stat strong{display:block;font-size:19px}.stat small{color:var(--muted);font-size:11px}.noteitem{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.noteitem:last-child{border:0}.noteitem button{border:0;background:#fff0f0;color:#b64c5a;border-radius:8px;padding:5px 9px}.result{margin-top:13px;padding:13px;border-radius:12px;background:#f7f4ff;color:#55418a;overflow-wrap:anywhere}.muted{color:var(--muted);font-size:12px}.footer{text-align:center;color:#a19bad;font-size:11px;margin:32px 0 0}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.app{padding:17px 15px 32px}.hero h2{font-size:24px}}@media(min-width:651px){.hero{padding:32px}}
body.dark{--bg:#171421;--panel:#211d2d;--ink:#f5f1ff;--muted:#aaa1bc;--line:#393148;--lav2:#352b4d;--shadow:0 10px 30px #0002}body.dark .iconbtn,body.dark .field,body.dark .noteitem button{background:#211d2d;color:var(--ink)}body.dark .hero{background:linear-gradient(120deg,#302544,#211d2d)}body.dark .result,body.dark .stat{background:#302544;color:#e6dcff}
</style></head>
<body><main class="app">
<header class="top"><div class="brand"><div class="logo">D</div><div><h1>DailyKit</h1><small>Everyday tools. One simple app.</small></div></div><div style="display:flex;gap:8px"><button class="iconbtn hidden" id="installBtn">Install</button><button class="iconbtn" id="themeBtn" aria-label="Toggle dark mode">☾</button></div></header>
<section id="home" class="view active"><div class="hero"><div class="eyebrow">Your everyday toolkit</div><h2>Small tools.<br>Big help.</h2><p>Simple, useful utilities that work right on your device. No account needed.</p></div><div class="sectionhead"><h3>Explore tools</h3><span>8 handy utilities</span></div><input class="field" id="toolSearch" placeholder="Search tools..." aria-label="Search tools" style="margin-bottom:13px"><div class="grid" id="toolGrid">
<button class="tile" data-tool="calculator"><span class="emoji">🧮</span><b>Calculator</b><small>Quick calculations</small></button>
<button class="tile" data-tool="words"><span class="emoji">✍️</span><b>Word counter</b><small>Words & characters</small></button>
<button class="tile" data-tool="notes"><span class="emoji">🗒️</span><b>Quick notes</b><small>Saved on this device</small></button>
<button class="tile" data-tool="units"><span class="emoji">📏</span><b>Unit converter</b><small>Common measurements</small></button>
<button class="tile" data-tool="text"><span class="emoji">🔤</span><b>Text formatter</b><small>Change text case</small></button>
<button class="tile" data-tool="image"><span class="emoji">🖼️</span><b>Image compressor</b><small>Reduce image size</small></button>
<button class="tile" data-tool="pdf"><span class="emoji">📄</span><b>Save as PDF</b><small>Print notes to PDF</small></button>
<button class="tile" data-tool="qr"><span class="emoji">▦</span><b>QR generator</b><small>Create & save QR codes</small></button>
</div><div class="row" style="justify-content:center;margin-top:22px"><button class="btn secondary" id="shareApp">Share DailyKit</button><button class="btn secondary" id="privacyBtn">Privacy</button></div><p class="footer">DailyKit · Version 1.1 · Your notes stay on this device</p></section>
<section id="tool" class="view"><button class="back" id="back">← All tools</button><div class="card" id="toolContent"></div></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script>
const $=s=>document.querySelector(s);const content=$('#toolContent');let current='';
function openTool(name){current=name;$('#home').classList.remove('active');$('#tool').classList.add('active');const views={
calculator:`<h2>Calculator</h2><p class="sub">A simple calculator for everyday maths.</p><input class="field" id="calc" inputmode="decimal" placeholder="Example: (12 + 8) × 3"><div class="row"><button class="btn" id="calcGo">Calculate</button><button class="btn secondary" id="calcClear">Clear</button></div><div class="result hidden" id="calcResult"></div><p class="muted">Tip: Use +, -, *, /, parentheses and decimals.</p>`,
words:`<h2>Word counter</h2><p class="sub">Type or paste text to count it instantly.</p><textarea class="field area" id="wordText" placeholder="Start typing here..."></textarea><div class="stats"><div class="stat"><strong id="wc">0</strong><small>Words</small></div><div class="stat"><strong id="cc">0</strong><small>Characters</small></div><div class="stat"><strong id="sc">0</strong><small>Sentences</small></div></div>`,
notes:`<h2>Quick notes</h2><p class="sub">Notes are stored locally in this browser on this device.</p><input class="field" id="noteTitle" placeholder="Note title"><textarea class="field area" id="noteBody" placeholder="Write a note..."></textarea><div class="row"><button class="btn" id="saveNote">Save note</button></div><div id="notesList"></div>`,
units:`<h2>Unit converter</h2><p class="sub">Convert common length, weight and temperature units.</p><input class="field" id="unitValue" type="number" placeholder="Enter a value" value="1"><div class="row"><select class="field" id="unitType"><option value="length">Length</option><option value="weight">Weight</option><option value="temp">Temperature</option></select></div><div class="row"><select class="field" id="unitFrom"></select><select class="field" id="unitTo"></select></div><div class="result" id="unitResult">1 metre = 100 centimetres</div>`,
text:`<h2>Text formatter</h2><p class="sub">Change the case of your text in one tap.</p><textarea class="field area" id="formatInput" placeholder="Enter your text..."></textarea><div class="row"><button class="btn" data-case="upper">UPPERCASE</button><button class="btn secondary" data-case="lower">lowercase</button><button class="btn secondary" data-case="title">Title Case</button></div><textarea class="field area" id="formatOutput" placeholder="Your formatted text appears here..." readonly style="margin-top:12px"></textarea><div class="row"><button class="btn secondary" id="copyText">Copy result</button></div>`,
image:`<h2>Image compressor</h2><p class="sub">Compress an image in your browser. Your image is not uploaded.</p><input class="field" id="imageFile" type="file" accept="image/*"><div class="row"><label class="muted">Quality <input id="quality" type="range" min="30" max="95" value="75"></label><span id="qualityVal" class="muted">75%</span></div><div id="imageInfo" class="result hidden"></div><div class="row"><button class="btn hidden" id="downloadImage">Download compressed image</button></div><canvas id="imageCanvas" class="hidden" style="max-width:100%"></canvas>`,
pdf:`<h2>Save as PDF</h2><p class="sub">Create a simple PDF from text using your device's print menu.</p><input class="field" id="pdfTitle" placeholder="Document title"><textarea class="field area" id="pdfText" placeholder="Write or paste your document here..."></textarea><div class="row"><button class="btn" id="makePdf">Open print / Save as PDF</button></div><p class="muted">Choose “Save as PDF” in the print destination menu if your browser offers it.</p>`,
qr:`<h2>QR code generator</h2><p class="sub">Turn a link, message or contact detail into a QR code.</p><label class="muted" for="qrText">Text or URL</label><textarea class="field area" id="qrText" placeholder="Paste a website link or type a message..." style="min-height:105px"></textarea><div class="row"><label class="muted" style="flex:1">Size<select class="field" id="qrSize"><option value="180">Small · 180 px</option><option value="240" selected>Medium · 240 px</option><option value="320">Large · 320 px</option></select></label><label class="muted" style="flex:1">Error correction<select class="field" id="qrLevel"><option value="L">Low</option><option value="M" selected>Medium</option><option value="Q">Quartile</option><option value="H">High</option></select></label></div><div class="row"><button class="btn" id="makeQr">Generate QR</button><button class="btn secondary" id="clearQr">Clear</button></div><div id="qrStatus" class="muted" style="margin-top:12px" aria-live="polite">Your QR code is generated in your browser. Avoid putting private information in a QR code you plan to share.</div><div id="qrOutput" style="display:flex;justify-content:center;margin:16px 0"></div><div class="row"><button class="btn secondary hidden" id="downloadQr">Download PNG</button></div><p class="muted">QR generation needs an internet connection the first time to load its small generator library. The text you enter is processed in your browser, not uploaded by DailyKit.</p>`};content.innerHTML=views[name]||'';bind(name)}
function bind(n){if(n==='calculator'){$('#calcGo').onclick=()=>{let s=$('#calc').value;if(!/^[0-9+\-*/().%\s]+$/.test(s)){showCalc('Please enter a valid maths expression.');return}try{let r=Function('"use strict";return ('+s+')')();showCalc(Number.isFinite(r)?String(r):'Cannot calculate this expression.')}catch{showCalc('Please check the expression.')}};$('#calcClear').onclick=()=>{$('#calc').value='';$('#calcResult').classList.add('hidden')};$('#calc').addEventListener('keydown',e=>{if(e.key==='Enter')$('#calcGo').click()})}
if(n==='words'){$('#wordText').oninput=()=>{let t=$('#wordText').value;$('#wc').textContent=(t.trim().match(/\S+/g)||[]).length;$('#cc').textContent=t.length;$('#sc').textContent=(t.match(/[.!?]+(?=\s|$)/g)||[]).length}}
if(n==='notes'){renderNotes();$('#saveNote').onclick=()=>{let title=$('#noteTitle').value.trim(),body=$('#noteBody').value.trim();if(!title&&!body)return;let a=JSON.parse(localStorage.getItem('dailykit-notes')||'[]');a.unshift({id:Date.now(),title:title||'Untitled note',body});localStorage.setItem('dailykit-notes',JSON.stringify(a));$('#noteTitle').value='';$('#noteBody').value='';renderNotes()}};
if(n==='units'){const opts={length:['metres','kilometres','centimetres','feet','inches'],weight:['kilograms','grams','pounds'],temp:['Celsius','Fahrenheit']};function fill(){let a=opts[$('#unitType').value];$('#unitFrom').innerHTML=a.map(x=>`<option>${x}</option>`).join('');$('#unitTo').innerHTML=a.map(x=>`<option>${x}</option>`).join('');if(a.length>1)$('#unitTo').selectedIndex=1;convert()}function convert(){let v=Number($('#unitValue').value),type=$('#unitType').value,f=$('#unitFrom').value,t=$('#unitTo').value;if(!Number.isFinite(v))return;let bases={metres:1,kilometres:1000,centimetres:.01,feet:.3048,inches:.0254,kilograms:1,grams:.001,pounds:.45359237};let out;if(type==='temp'){out=f===t?v:f==='Celsius'?v*9/5+32:(v-32)*5/9}else out=v*bases[f]/bases[t];$('#unitResult').textContent=`${v} ${f} = ${Number(out.toFixed(6))} ${t}`}$('#unitType').onchange=fill;$('#unitValue').oninput=convert;$('#unitFrom').onchange=convert;$('#unitTo').onchange=convert;fill()}
if(n==='text'){$$('[data-case]').forEach(b=>b.onclick=()=>{let t=$('#formatInput').value,mode=b.dataset.case;$('#formatOutput').value=mode==='upper'?t.toUpperCase():mode==='lower'?t.toLowerCase():t.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase())});$('#copyText').onclick=()=>copy($('#formatOutput').value)}
if(n==='image'){let blobUrl='';let selectedImage=null;$('#quality').oninput=()=>{$('#qualityVal').textContent=$('#quality').value+'%';if(selectedImage)compressSelected()};$('#imageFile').onchange=()=>{selectedImage=$('#imageFile').files[0];compressSelected()};function compressSelected(){let f=selectedImage;if(!f)return;let img=new Image();img.onload=()=>{let c=$('#imageCanvas'),ctx=c.getContext('2d');let scale=Math.min(1,2000/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);ctx.drawImage(img,0,0,c.width,c.height);c.toBlob(blob=>{if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(blob);$('#imageInfo').classList.remove('hidden');$('#imageInfo').textContent=`Original: ${(f.size/1024).toFixed(1)} KB · Compressed: ${(blob.size/1024).toFixed(1)} KB`;let d=$('#downloadImage');d.classList.remove('hidden');d.onclick=()=>{let a=document.createElement('a');a.href=blobUrl;a.download='dailykit-compressed.jpg';a.click()}},'image/jpeg',Number($('#quality').value)/100)};img.src=URL.createObjectURL(f)}}
if(n==='pdf')$('#makePdf').onclick=()=>{let title=$('#pdfTitle').value||'DailyKit document',txt=$('#pdfText').value;let w=window.open('','_blank');if(!w){alert('Allow pop-ups to create your PDF.');return}w.document.write('<!doctype html><title>'+escapeHtml(title)+'</title><style>body{font:14px/1.6 Arial;padding:40px;white-space:pre-wrap}h1{font-size:22px}</style><h1>'+escapeHtml(title)+'</h1><div>'+escapeHtml(txt)+'</div>');w.document.close();w.focus();setTimeout(()=>w.print(),300)};
if(n==='qr'){let qrInstance=null;$('#makeQr').onclick=()=>{let value=$('#qrText').value.trim(),out=$('#qrOutput'),status=$('#qrStatus');out.innerHTML='';$('#downloadQr').classList.add('hidden');if(!value){status.textContent='Please enter some text or a URL first.';return}if(typeof QRCode==='undefined'){status.textContent='QR library could not load. Connect to the internet, refresh DailyKit and try again.';return}try{new QRCode(out,{text:value,width:Number($('#qrSize').value),height:Number($('#qrSize').value),colorDark:'#29243a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel[$('#qrLevel').value]});status.textContent='Your QR code is ready. Download it as a PNG.';$('#downloadQr').classList.remove('hidden');$('#downloadQr').onclick=()=>{let canvas=out.querySelector('canvas'),img=out.querySelector('img'),url=canvas?canvas.toDataURL('image/png'):img?.src;if(!url){status.textContent='Could not prepare the image for download.';return}let a=document.createElement('a');a.href=url;a.download='dailykit-qr.png';a.click()}}catch(e){status.textContent='Could not generate this QR code. Try shorter text.'}};$('#clearQr').onclick=()=>{$('#qrText').value='';$('#qrOutput').innerHTML='';$('#qrStatus').textContent='Enter text or a URL to create a QR code.';$('#downloadQr').classList.add('hidden')}}
}
function $$(s){return [...document.querySelectorAll(s)]}function showCalc(t){let r=$('#calcResult');r.textContent=t;r.classList.remove('hidden')}function copy(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert('Copied!')).catch(()=>alert('Copy not available.'));else alert('Copy is not available in this browser.')}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderNotes(){let a=JSON.parse(localStorage.getItem('dailykit-notes')||'[]');$('#notesList').innerHTML=a.length?a.map(x=>`<div class="noteitem"><div><b>${escapeHtml(x.title)}</b><div class="muted">${escapeHtml(x.body).replace(/\n/g,'<br>')}</div></div><button data-del="${x.id}">Delete</button></div>`).join(''):'<p class="muted">No notes yet.</p>';$$('[data-del]').forEach(b=>b.onclick=()=>{let a=JSON.parse(localStorage.getItem('dailykit-notes')||'[]').filter(x=>x.id!==Number(b.dataset.del));localStorage.setItem('dailykit-notes',JSON.stringify(a));renderNotes()})}
$$('[data-tool]').forEach(b=>b.onclick=()=>openTool(b.dataset.tool));$('#back').onclick=()=>{$('#tool').classList.remove('active');$('#home').classList.add('active')};$('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('dailykit-dark',document.body.classList.contains('dark')?'1':'0');$('#themeBtn').textContent=document.body.classList.contains('dark')?'☀':'☾'};if(localStorage.getItem('dailykit-dark')==='1'){document.body.classList.add('dark');$('#themeBtn').textContent='☀'}
$('#toolSearch').addEventListener('input',e=>{let q=e.target.value.toLowerCase();$$('[data-tool]').forEach(b=>b.classList.toggle('hidden',!b.innerText.toLowerCase().includes(q)))});$('#shareApp').onclick=async()=>{let data={title:'DailyKit',text:'DailyKit — everyday tools in one simple app.'};if(navigator.share){try{await navigator.share(data)}catch(e){}}else{copy(location.href)}};$('#privacyBtn').onclick=()=>alert('Privacy: DailyKit processes tool inputs in your browser. Notes are stored locally on this device. DailyKit does not require an account. If advertising is added in a future release, this notice and consent requirements will be updated before release.');let installPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#installBtn').classList.remove('hidden')});$('#installBtn').onclick=async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('#installBtn').classList.add('hidden')};if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
